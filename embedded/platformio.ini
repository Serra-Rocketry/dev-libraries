[platformio]
; Os exemplos são projetos ESP-IDF independentes. Compile e grave a partir
; da pasta do exemplo desejado, por exemplo:
;
;   pio run           -d examples/test_lsm6ds3
;   pio run           -d examples/test_lsm6ds3 -t upload
;   pio device monitor -d examples/test_lsm6ds3
;
; Este arquivo faz a raiz do repositório ser reconhecida pelo PlatformIO.
